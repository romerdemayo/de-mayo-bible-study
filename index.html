<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="De Mayo Bible">
  <meta name="description" content="Offline KJV Bible reader, study notes, prayer journal, reading plan and ministry tools.">
  <link rel="manifest" href="manifest.webmanifest?v=13">
  <link rel="apple-touch-icon" href="icon-192.png?v=13">
  <title>De Mayo Bible Ministry</title>
  <link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div class="app-shell">
  <aside id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark">✝</div>
      <div><b>De Mayo</b><small>Bible Study</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <strong>Offline KJV</strong>
      <span>Your personal content stays on this device.</span>
    </div>
  </aside>
  <button id="sidebarOverlay" class="sidebar-overlay" aria-label="Close menu" tabindex="-1"></button>

  <main>
    <header class="topbar">
      <button id="menu" class="icon-btn menu-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div class="title-wrap">
        <h1 id="pageTitle">Home</h1>
        <p id="pageSub">Read, study, pray, and prepare.</p>
      </div>
      <button class="icon-btn theme-btn" id="theme" aria-label="Change theme">◐</button>
    </header>
    <section id="view"></section>
  </main>
</div>

<nav id="mobileNav" class="mobile-nav"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script defer src="bible-data.js?v=13"></script>
<script defer src="data/devotionals.js?v=13"></script>
<script defer src="data/exhortations.js?v=13"></script>
<script defer src="data/bible-studies.js?v=13"></script>
<script defer src="data/kids-lessons.js?v=13"></script>
<script defer src="data/prayers.js?v=13"></script>
<script defer src="app.js?v=13"></script>
<script>
window.addEventListener('error', function (event) {
  const view = document.getElementById('view');
  if (view && !view.innerHTML.trim()) {
    view.innerHTML = '<div class="card startup-error"><h2>The app could not finish loading</h2><p>Please refresh the page. If this remains, clear the website data or remove and reinstall the Home Screen app.</p><p class="error-detail"></p></div>';
    const detail = view.querySelector('.error-detail');
    if (detail) detail.textContent = event.message || 'A required app file did not load.';
  }
});
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('./service-worker.js?v=13', { updateViaCache: 'none' });
      await registration.update();
    } catch (error) {
      console.warn('Service worker registration was skipped:', error);
    }
  });
}
</script>
</body>
</html>
