<!doctype html>
<html lang="en" data-language="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="De Mayo Bible">
  <meta name="description" content="Easy-to-read WEB Bible with bilingual ministry libraries, guided reading plans, salvation guide, Bible characters and study tools.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>De Mayo Bible Ministry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div class="app-shell">
  <aside id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark">✝</div>
      <div><b>De Mayo</b><small>Bible Study</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <strong id="translationLabel">Easy-English WEB Bible</strong>
      <span id="privacyLabel">Your personal content stays on this device.</span>
    </div>
  </aside>
  <button id="sidebarOverlay" class="sidebar-overlay" aria-label="Close menu" tabindex="-1"></button>

  <main>
    <header class="topbar">
      <button id="menu" class="icon-btn menu-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div class="title-wrap">
        <h1 id="pageTitle">Home</h1>
        <p id="pageSub">Read, study, pray, and prepare.</p>
      </div>
      <button class="language-btn" id="language" aria-label="Change language">EN</button>
      <button class="icon-btn theme-btn" id="theme" aria-label="Change theme">◐</button>
    </header>
    <section id="view"></section>
  </main>
</div>

<nav id="mobileNav" class="mobile-nav"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script src="data/tagalog-bible-loader.js?v=25"></script>
<script src="bible-data.js?v=25"></script>
<script src="data/devotionals.js?v=25"></script>
<script src="data/exhortations.js?v=25"></script>
<script src="data/bible-studies.js?v=25"></script>
<script src="data/kids-lessons.js?v=25"></script>
<script src="data/prayers.js?v=25"></script>
<script src="data/v20-tools.js?v=25"></script>
<script src="app.js?v=25"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
}
</script>
</body>
</html>
